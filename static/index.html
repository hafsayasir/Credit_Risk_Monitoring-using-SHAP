<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan default risk assessment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page">

    <header class="masthead">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" />
        <circle cx="20" cy="20" r="8" />
        <path d="M20 2v10M20 28v10M2 20h10M28 20h10" />
      </svg>
      <div>
        <h1>Credit Ledger</h1>
        <p>A unified platform for credit risk assessment</p>
      </div>
    </header>

    <main class="layout">

      <form id="loan-form" novalidate>

        <section class="card">
          <h2 class="card-title">01 &mdash; Applicant</h2>

          <div class="field">
            <label for="person_age">Age</label>
            <div class="control">
              <input id="person_age" name="person_age" type="number" inputmode="numeric" min="18" max="100" step="1" required>
              <span class="unit">years</span>
            </div>
            <p class="error" id="err-person_age"></p>
          </div>

          <div class="field">
            <label for="person_income">Annual income (USD)</label>
            <div class="control">
              <span class="unit">$</span>
              <input id="person_income" name="person_income" type="number" inputmode="decimal" min="1" step="any" required>
            </div>
            <p class="error" id="err-person_income"></p>
          </div>

          <div class="field">
            <label for="person_home_ownership">Home ownership</label>
            <div class="control">
              <select id="person_home_ownership" name="person_home_ownership" required>
                <option value="">Select</option>
                <option value="RENT">Rent</option>
                <option value="MORTGAGE">Mortgage</option>
                <option value="OWN">Own</option>
                <option value="OTHER">Other</option>
              </select>
            </div>
            <p class="error" id="err-person_home_ownership"></p>
          </div>

          <div class="field">
            <label for="person_emp_length">Employment length</label>
            <div class="control">
              <input id="person_emp_length" name="person_emp_length" type="number" inputmode="decimal" min="0" max="60" step="any" required>
              <span class="unit">years</span>
            </div>
            <p class="error" id="err-person_emp_length"></p>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">02 &mdash; Loan</h2>

          <div class="field">
            <label for="loan_intent">Purpose</label>
            <div class="control">
              <select id="loan_intent" name="loan_intent" required>
                <option value="">Select</option>
                <option value="PERSONAL">Personal</option>
                <option value="EDUCATION">Education</option>
                <option value="MEDICAL">Medical</option>
                <option value="VENTURE">Venture</option>
                <option value="HOMEIMPROVEMENT">Home improvement</option>
                <option value="DEBTCONSOLIDATION">Debt consolidation</option>
              </select>
            </div>
            <p class="error" id="err-loan_intent"></p>
          </div>

          <div class="field">
            <label for="loan_grade">Loan grade</label>
            <div class="control">
              <select id="loan_grade" name="loan_grade" required>
                <option value="">Select</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
              </select>
            </div>
            <p class="error" id="err-loan_grade"></p>
          </div>

          <div class="field">
            <label for="loan_amnt">Loan amount (USD)</label>
            <div class="control">
              <span class="unit">$</span>
              <input id="loan_amnt" name="loan_amnt" type="number" inputmode="decimal" min="1" step="any" required>
            </div>
            <p class="error" id="err-loan_amnt"></p>
          </div>

          <div class="field">
            <label for="loan_int_rate">Interest rate</label>
            <div class="control">
              <input id="loan_int_rate" name="loan_int_rate" type="number" inputmode="decimal" min="0" max="40" step="any" required>
              <span class="unit">%</span>
            </div>
            <p class="error" id="err-loan_int_rate"></p>
          </div>

          <div class="field">
            <label for="loan_share">Loan as share of income</label>
            <div class="control">
              <input id="loan_share" type="text" value="Calculated from income and loan amount" readonly tabindex="-1" class="calculated">
            </div>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">03 &mdash; Credit history</h2>

          <div class="field">
            <span class="label" id="default-label">Previous default on file</span>
            <div class="control">
              <div class="segmented" role="radiogroup" aria-labelledby="default-label">
                <input type="radio" id="default-n" name="cb_person_default_on_file" value="N" checked>
                <label for="default-n">No</label>
                <input type="radio" id="default-y" name="cb_person_default_on_file" value="Y">
                <label for="default-y">Yes</label>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="cb_person_cred_hist_length">Credit history length</label>
            <div class="control">
              <input id="cb_person_cred_hist_length" name="cb_person_cred_hist_length" type="number" inputmode="numeric" min="0" max="60" step="1" required>
              <span class="unit">years</span>
            </div>
            <p class="error" id="err-cb_person_cred_hist_length"></p>
          </div>
        </section>

        <div class="actions">
          <button type="submit" class="primary" id="submit-btn">
            <span class="btn-label">Assess risk</span>
          </button>
          <button type="button" class="link" id="example-btn">Fill example</button>
        </div>
      </form>

      <aside class="panel is-idle" id="panel" aria-live="polite" aria-busy="false">
        <h2 class="card-title">Result</h2>

        <svg id="gauge" viewBox="0 0 200 200" role="img" aria-label="Default probability ring">
          <path id="track" class="track"></path>
          <path id="arc" class="arc"></path>
          <line id="mark" class="mark" opacity="0"></line>
          <text id="value" class="value" x="100" y="103" text-anchor="middle">&#8211;</text>
          <text class="pct" x="100" y="123" text-anchor="middle">%</text>
          <text class="caption" x="100" y="143" text-anchor="middle">default probability</text>
        </svg>

        <div class="result">
          <p id="verdict" class="verdict">No result yet</p>
          <p id="verdict-detail" class="detail">Fill in the form and select Assess risk.</p>
        </div>

        <dl class="facts">
          <div>
            <dt>Default probability</dt>
            <dd id="fact-prob">&#8211;</dd>
          </div>
          <div>
            <dt class="has-mark">Decision threshold</dt>
            <dd id="fact-threshold">&#8211;</dd>
          </div>
          <div>
            <dt>Verdict</dt>
            <dd id="fact-verdict">&#8211;</dd>
          </div>
        </dl>

      
      </aside>

    </main>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
